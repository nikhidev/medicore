name: MediCore verification
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: pip install -r analytics/requirements.txt
      - run: python -m pytest -q analytics
      - run: docker compose up --build --detach --wait
        env:
          POSTGRES_PASSWORD: ci-build-only
          ANALYTICS_KEY: ci-build-only

      - run: node tests/compose-smoke.mjs
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
